name: Build Test APK

# 在 fork 仓库中自动构建可安装的 APK，产物同时上传为 artifact 并挂到
# `apk-latest` 预发布页面，方便直接用手机浏览器下载。
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Remove Aliyun mirror repositories (unreachable from GitHub-hosted runners)
        run: sed -i '/maven\.aliyun\.com/d' settings.gradle.kts

      # 优先使用仓库 Secret；fork 没有该 Secret 时退回占位配置。
      # 占位配置仅用于让 google-services / firebase 插件在编译期通过，
      # 不包含任何真实项目信息，Firebase 相关功能在测试包里不会工作。
      - name: Prepare google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FALLBACK: ""
        run: |
          if [ -n "$DATA" ]; then
            printf '%s' "$DATA" | base64 -di > app/google-services.json
            echo "已使用仓库 Secret 中的 google-services.json"
          else
            printf '%s' "$FALLBACK" | base64 -d > app/google-services.json
            echo "未配置 Secret，改用占位 google-services.json（仅供编译与本地测试）"
          fi

      # release 构建需要签名。fork 没有正式 keystore，这里生成一个临时自签名证书，
      # 仅用于测试安装，不能用于上架或覆盖官方版本。
      - name: Generate temporary keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/keystore.jks" \
            -alias hanime \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hanime123456 -keypass hanime123456 \
            -dname "CN=Han1meViewer Test, OU=Local, O=Local, L=Local, ST=Local, C=CN"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: hanime123456
          KEY_PASSWORD: hanime123456
          KEY_ALIAS: hanime
          HA1_VERSION_SOURCE: 'ci'
        run: ./gradlew assembleRelease -x lint --stacktrace

      - name: Show outputs
        run: |
          ls -lh app/build/outputs/apk/release/
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/release/*.apk; do
            echo "- $(basename "$f") ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish to prerelease
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 测试版 APK（自动构建）
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            由 GitHub Actions 自动构建的测试版 APK。

            - 提交：`${{ github.sha }}`
            - 构建时间：${{ github.event.repository.updated_at }}
            - 使用临时自签名证书，安装前需卸载官方版本（签名不同）
            - Firebase 使用占位配置，相关功能不可用

            手机请下载 `universal` 版本；按架构分包版本体积更小。
