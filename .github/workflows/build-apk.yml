name: Build Test APK

# 在 fork 仓库中自动构建可安装的 APK，产物同时上传为 artifact 并挂到
# `apk-latest` 预发布页面，方便直接用手机浏览器下载。
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Remove Aliyun mirror repositories (unreachable from GitHub-hosted runners)
        run: sed -i '/maven\.aliyun\.com/d' settings.gradle.kts

      # 优先使用仓库 Secret；fork 没有该 Secret 时退回占位配置。
      # 占位配置仅用于让 google-services / firebase 插件在编译期通过，
      # 不包含任何真实项目信息，Firebase 相关功能在测试包里不会工作。
      - name: Prepare google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FALLBACK: ""
        run: |
          if [ -n "$DATA" ]; then
            printf '%s' "$DATA" | base64 -di > app/google-services.json
            echo "已使用仓库 Secret 中的 google-services.json"
          else
            printf '%s' "$FALLBACK" | base64 -d > app/google-services.json
            echo "未配置 Secret，改用占位 google-services.json（仅供编译与本地测试）"
          fi

      # 固定测试签名。fork 没有正式 keystore，这里用一份公开的测试密钥，
      # 保证每次构建签名一致 —— 装过一次之后可以直接覆盖升级，不用每次卸载。
      - name: Restore test keystore
        env:
          KEYSTORE_B64: ""
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/keystore.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: hanime123456
          KEY_PASSWORD: hanime123456
          KEY_ALIAS: hanime
          HA1_VERSION_SOURCE: 'ci'
          # 安全模式：关闭 R8/资源压缩，并在运行时跳过 Firebase。
          # 用于排除「混淆」与「fork 缺少真实 Firebase 配置」这两个与上游唯一的差异。
          HA1_SAFE_MODE: 'true'
        run: ./gradlew assembleRelease -x lint --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Show outputs
        run: |
          ls -lh app/build/outputs/apk/release/
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/release/*.apk; do
            echo "- $(basename "$f") ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 只保留本次构建的产物，避免 Release 页面堆积一堆旧版本，用户下错包
      - name: Prune old assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FIRST=$(basename "$(ls app/build/outputs/apk/release/*.apk | head -1)")
          PREFIX="${FIRST%%-*}"
          echo "keep prefix: $PREFIX"
          gh release view apk-latest --json assets -q '.assets[].name' 2>/dev/null | while read -r name; do
            case "$name" in
              "$PREFIX"-*) echo "keep $name" ;;
              *) echo "delete $name"; gh release delete-asset apk-latest "$name" -y 2>/dev/null || true ;;
            esac
          done

      - name: Publish to prerelease
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 测试版 APK（自动构建）
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            由 GitHub Actions 自动构建的测试版 APK。

            - 提交：`${{ github.sha }}`
            - 构建时间：${{ github.event.repository.updated_at }}
            - 使用**固定测试签名**，可直接覆盖安装本仓库的历史测试包；与官方版签名不同，从官方版切换需先卸载
            - 本构建为**安全模式**：关闭 R8/资源压缩，运行时跳过 Firebase（用于排查启动异常）
            - 包内会写出启动轨迹 `hanime-trace.txt` 与崩溃日志 `hanime-crash.txt` 到「下载」目录

            手机请下载 `universal` 版本；按架构分包版本体积更小（arm64-v8a 覆盖绝大多数机型）。
